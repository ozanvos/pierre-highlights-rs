[package]
name = "pierre-highlights-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Unofficial Rust port of Pierre Highlights"
repository = "https://github.com/ozanvos/pierre-highlights-rs"
readme = "README.md"

[workspace]

[features]
default = []
scalar = []

[dev-dependencies]
serde_json = "1"
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
